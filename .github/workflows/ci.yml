name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Laufende Runs bei neuem Push auf denselben Ref abbrechen
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck, Lint, Next-Build
  quality:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Next build
        run: npm run build

  # OpenNext-Worker-Bundle bauen (fängt Cloudflare-/Bundling-Fehler ab)
  worker-build:
    name: Cloudflare Worker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: OpenNext build
        run: npm run cf-build

  # E2E- und Accessibility-Tests (Playwright + axe)
  e2e:
    name: E2E & Accessibility (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Tests
        run: npm run test:e2e
      - name: Report hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
