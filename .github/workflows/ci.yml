name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Laufende Runs bei neuem Push auf denselben Ref abbrechen
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck, Lint, Format, Unit-Tests, Next-Build, First-Load-JS-Budget
  quality:
    name: Typecheck · Lint · Format · Unit · Build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format-Check (Prettier)
        run: npm run format:check
      - name: Unit-Tests (Vitest)
        run: npm run test:unit
      - name: Next build
        run: npm run build
      - name: First-Load-JS-Budget
        run: npm run check:bundle

  # OpenNext-Worker-Bundle bauen (fängt Cloudflare-/Bundling-Fehler ab)
  worker-build:
    name: Cloudflare Worker Build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: OpenNext build
        run: npm run cf-build

  # E2E- und Accessibility-Tests (Playwright + axe), Desktop + Mobile
  e2e:
    name: E2E & Accessibility (Playwright)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Tests
        run: npm run test:e2e
      - name: Report hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Performance-Budgets (Lighthouse CI) + interner Link-Check
  perf:
    name: Lighthouse & Link-Check
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Chromium über Playwright bereitstellen – der self-hosted Runner hat
      # nicht zwingend ein systemweites Chrome für Lighthouse.
      - name: Playwright-Chromium installieren
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      # Einen Server für Lighthouse UND Link-Check starten (persistiert über
      # die folgenden Steps). Robuster als lhci seinen eigenen Server managen
      # zu lassen – warten, bis er wirklich antwortet.
      - name: Server starten
        run: |
          npm run start &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:3000/ >/dev/null && break
            sleep 1
          done
      - name: Lighthouse CI (Budgets)
        run: |
          CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" \
            npm run lhci
      - name: Link-Check (interne Links)
        run: npm run check:links
      - name: Lighthouse-Report hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/report/
          retention-days: 7
