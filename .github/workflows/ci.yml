name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Laufende Runs bei neuem Push auf denselben Ref abbrechen
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck, Lint, Format, Unit-Tests, Next-Build, First-Load-JS-Budget
  quality:
    name: Typecheck · Lint · Format · Unit · Build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format-Check (Prettier)
        run: npm run format:check
      - name: Unit-Tests (Vitest)
        run: npm run test:unit
      - name: Next build
        run: npm run build
      - name: First-Load-JS-Budget
        run: npm run check:bundle

  # OpenNext-Worker-Bundle bauen (fängt Cloudflare-/Bundling-Fehler ab)
  worker-build:
    name: Cloudflare Worker Build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: OpenNext build
        run: npm run cf-build

  # E2E- und Accessibility-Tests (Playwright + axe), Desktop + Mobile
  e2e:
    name: E2E & Accessibility (Playwright)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Tests
        run: npm run test:e2e
      - name: Report hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Performance-Budgets (Lighthouse CI) + interner Link-Check
  perf:
    name: Lighthouse & Link-Check
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Chromium über Playwright bereitstellen – der self-hosted Runner hat
      # nicht zwingend ein systemweites Chrome für Lighthouse.
      - name: Playwright-Chromium installieren
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      # Einen Server für Lighthouse UND Link-Check starten (persistiert über
      # die folgenden Steps). Bewusst auf Port 4319 statt 3000: der
      # self-hosted Runner ist eine echte Maschine, auf der Port 3000 oft schon
      # belegt ist (Dev-Server/wrangler) – sonst würde Lighthouse den falschen
      # Server prüfen. Warten, bis unser Server wirklich antwortet.
      - name: Server starten
        run: |
          PORT=4319 npm run start &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:4319/ >/dev/null && break
            sleep 1
          done
      # Advisory: Lighthouse läuft, blockt aber nicht. Auf einem verwalteten
      # (Firmen-)Rechner erzwingt eine Chrome-Policy (z. B. HTTPS-Only) ein
      # Interstitial auf HTTP-Seiten – das lässt sich per Flag nicht abschalten
      # und ist kein Code-Problem. Die Substanz ist ohnehin hart abgesichert:
      # a11y/SEO/CLS über die axe-/e2e-Tests, JS-Gewicht über das Bundle-Budget.
      - name: Lighthouse CI (Budgets, advisory)
        continue-on-error: true
        run: |
          CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" \
            npm run lhci
      - name: Link-Check (interne Links)
        run: npm run check:links
      - name: Lighthouse-Report hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci/report/
          retention-days: 7
